[pytest]
testpaths = tests
addopts = -q

# The tests import `app.main` and `app.model_adapter`, but there is no
# installable package here: `app/` is just a directory at the repo root.
#
# `python -m pytest` happens to work anyway, because the -m form puts the
# current directory on sys.path. The bare `pytest` console script does not,
# so the suite was collectable one way and not the other, and CI found the
# difference the first time it ran. Setting pythonpath makes both forms work.
pythonpath = .
