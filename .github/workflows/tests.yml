name: tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # requirements-dev.txt, not requirements.txt. The runtime file is
      # deliberately minimal so the served image stays small; the suite
      # additionally needs httpx (starlette's TestClient wraps it) and shap
      # (test_closed_form_matches_shap_linear_explainer cross-checks the
      # analytic attributions against the reference implementation).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v
